name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder values: the build only needs these to be present and
      # well-formed. No network calls are made to these services during build.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      # pk_test_ + base64("clerk.example.accounts.dev$")
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      GEMINI_API_KEY: placeholder
      E2B_API_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build
